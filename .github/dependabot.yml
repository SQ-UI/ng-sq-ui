version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  target-branch: morph-main
  reviewers:
  - samuil4
  assignees:
  - samuil4
  labels:
  - dependency update
  groups:
    angular:
      patterns:
      - "@angular/*"
    tooling:
      patterns:
      - "eslint*"
      - "typescript-eslint"
      - "typescript"
      - "vitest"
      - "@vitest/*"
      - "@analogjs/*"
ignore:
  - dependency-name: "*"
    update-types: ["version-update:semver-patch", "version-update:semver-minor"]
