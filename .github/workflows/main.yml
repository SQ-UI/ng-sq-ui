# Verify changes and deploy the tested demo to Cloudflare Pages on master pushes.
name: CI

on:
  push:
    branches: [ master, main, morph-main ]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The libraries must be built first: the app build and the type-check resolve `@sq-ui/*` from
      # `dist/` when it exists (`tsconfig.dist.json`), so they need a fresh `dist/`.
      - name: Build the libraries
        run: npm run build:libs

      # Guards the `exports` map / entry points that ng-packagr generates for `dist/**`.
      - name: Verify the published package layout
        run: npm run check:exports

      - name: Type-check the workspace
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the demo application
        run: npm run build

      - name: Run the unit tests
        run: npm test

      - name: Save verified demo build
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: dist/sq-ui/browser
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      PAGES_PROJECT: sq-ui-demo
      PAGES_PRODUCTION_BRANCH: master
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Download verified demo build
        uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: demo-site

      # `wrangler pages deploy` does not create the Pages project, so create the Direct Upload
      # project on first run. The token needs "Cloudflare Pages: Edit" on this account.
      - name: Ensure the Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projects="$(npx --yes wrangler@4 pages project list)"
          if grep -qw -- "$PAGES_PROJECT" <<< "$projects"; then
            echo "Pages project '$PAGES_PROJECT' already exists."
          else
            echo "Creating Pages project '$PAGES_PROJECT'..."
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" \
              --production-branch="$PAGES_PRODUCTION_BRANCH"
          fi

      - name: Deploy verified demo
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy demo-site --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_PRODUCTION_BRANCH }}
