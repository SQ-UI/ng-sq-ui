<div class="time-picker display-flex justify-center align-items-center">
  <div class="time-unit display-flex column align-items-center">
    <button
      type="button"
      class="spinner display-flex justify-center align-items-center"
      (click)="increment(timeUnit.Hours)"
    >
      <i class="fas fa-chevron-up" aria-hidden="true"></i>
    </button>

    <div class="time display-flex column align-items-center">
      <input
        type="text"
        name="time"
        [value]="hoursText()"
        maxlength="2"
        minlength="1"
        [disabled]="!isEditable()"
        (input)="onHoursInput($any($event.target).value)"
        (change)="validateInput(timeUnit.Hours, $any($event.target).value)"
      />
    </div>

    <button
      type="button"
      class="spinner display-flex justify-center align-items-center"
      (click)="decrement(timeUnit.Hours)"
    >
      <i class="fas fa-chevron-down" aria-hidden="true"></i>
    </button>
  </div>

  <div class="time-unit divider">:</div>

  <div class="time-unit display-flex column align-items-center">
    <button
      type="button"
      class="spinner display-flex justify-center align-items-center"
      (click)="increment(timeUnit.Minutes)"
    >
      <i class="fas fa-chevron-up" aria-hidden="true"></i>
    </button>

    <div class="time">
      <input
        type="text"
        name="minutes"
        [value]="minutesText()"
        maxlength="2"
        minlength="1"
        [disabled]="!isEditable()"
        (input)="onMinutesInput($any($event.target).value)"
        (change)="validateInput(timeUnit.Minutes, $any($event.target).value)"
      />
    </div>

    <button
      type="button"
      class="spinner display-flex justify-center align-items-center"
      (click)="decrement(timeUnit.Minutes)"
    >
      <i class="fas fa-chevron-down" aria-hidden="true"></i>
    </button>
  </div>

  @if (isMeridiem()) {
    <div class="time-unit">
      <button
        type="button"
        class="display-flex justify-center align-items-center"
        (click)="changeNoonRelativity()"
      >
        <span class="meridiem">
          {{ noonRelativity().toUpperCase() }}
        </span>
        <i class="far fa-clock meridiem-icon" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
