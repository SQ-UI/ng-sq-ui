<div
  class="progress linear"
  [class.small]="size() === 'small'"
  [class.medium]="size() === 'medium'"
  [class.large]="size() === 'large'"
  [class.infinite]="infinite()"
>
  <div class="background"></div>
  <div class="progress-bar">
    @if (!infinite()) {
    <div class="loading-line" [style.width.%]="loaded()"></div>
    } @if (infinite()) {
    <div class="loading-line infinite-line-1"></div>
    } @if (infinite()) {
    <div class="loading-line infinite-line-2"></div>
    }
  </div>
</div>
