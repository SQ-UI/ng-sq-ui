<div class="progress linear" [ngClass]="{
    small: size() === 'small',
    medium: size() === 'medium',
    large: size() === 'large',
    infinite: infinite()
  }">
  <div class="background"></div>
  <div class="progress-bar">
    @if (!infinite()) {
      <div class="loading-line" [style.width.%]="loaded()"></div>
    } @else {
      <div class="loading-line infinite-line-1"></div>
      <div class="loading-line infinite-line-2"></div>
    }
  </div>
</div>
