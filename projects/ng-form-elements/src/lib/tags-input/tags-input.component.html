<div class="tags-input-wrapper sq-form-field" [attr.data-tags-size]="size()">
  @if (controlLabel()) {
    <label class="label sq-field-label"
           for="{{controlId()}}">
      {{controlLabel()}}
    </label>
  }
  <div class="input-field" [class.disabled]="disabled()">

    @if (value().length > 0) {
      <div class="entered-items">
        <div class="inner display-flex wrap">
          @for (enteredValue of value(); track $index) {
            <ng-template #defaultTagTemplate>
              <div class="entered-item">
                <span class="tag-label">{{enteredValue}}</span>
                @if (!disabled()) {
                  <button type="button"
                          class="button"
                          [attr.aria-label]="'Remove ' + enteredValue"
                          (click)="removeTag(enteredValue)">
                    <i aria-hidden="true"
                       class="fas fa-times"></i>
                  </button>
                }
              </div>
            </ng-template>

            <ng-template [ngTemplateOutlet]="tagTemplate() || defaultTagTemplate"
                         [ngTemplateOutletContext]="{ tag: enteredValue, remove: removeTag }">
            </ng-template>
          }
        </div>
      </div>
    }

    <input #tagsInput
           type="text"
           id="{{controlId()}}"
           name="{{name()}}"
           [disabled]="disabled()"
           [attr.aria-label]="controlLabel() ? null : controlPlaceholder() || null"
           [attr.aria-invalid]="errorText() ? 'true' : null"
           [attr.aria-describedby]="(errorText() || helpText()) ? controlId() + '-message' : null"
           (keydown)="onUserInput($event)"
           (blur)="touch.emit()"
           placeholder="{{controlPlaceholder()}}"
           [(ngModel)]="newTagName">
  </div>
  @if (errorText() || helpText()) {
    <div class="sq-field-message" [class.sq-field-error]="!!errorText()"
         [id]="controlId() + '-message'" [attr.role]="errorText() ? 'alert' : null">{{errorText() || helpText()}}</div>
  }
</div>
