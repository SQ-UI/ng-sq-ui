<div class="tags-input-wrapper">
  <div class="input-field" [class.disabled]="disabled()">
    @if (controlLabel()) {
    <label class="label" [for]="controlId()">
      {{ controlLabel() }}
    </label>
    } @if (value().length > 0) {
    <div class="entered-items">
      <div class="inner display-flex wrap">
        @for (enteredValue of value(); track enteredValue) {
        <ng-template #defaultTagTemplate>
          <div class="entered-item">
            {{ enteredValue }}
            @if (!disabled()) {
            <span class="button" (click)="removeTag(enteredValue)">
              <i aria-hidden="true" class="fas fa-times"></i>
            </span>
            }
          </div>
        </ng-template>
        <ng-template
          [ngTemplateOutlet]="tagTemplate() || defaultTagTemplate"
          [ngTemplateOutletContext]="{ tag: enteredValue, remove: removeTag }"
        >
        </ng-template>
        }
      </div>
    </div>
    }

    <input
      #tagsInput
      type="text"
      [id]="controlId()"
      [name]="name()"
      [disabled]="disabled()"
      [value]="newTagName()"
      (input)="onNewTagNameInput($event)"
      (keyup)="onUserInput($event)"
      [placeholder]="controlPlaceholder()"
    />
  </div>
</div>
