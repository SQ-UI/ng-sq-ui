<div class="input-field" [class.disabled]="disabled()">
  @if (controlLabel() !== '') {
  <label class="label" [for]="controlId()">
    {{ controlLabel() }}
  </label>
  }

  <input
    [type]="type()"
    [name]="name()"
    [id]="controlId()"
    [placeholder]="controlPlaceholder()"
    [required]="required()"
    [attr.pattern]="patternAttr()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="emitTouch()"
  />
</div>
