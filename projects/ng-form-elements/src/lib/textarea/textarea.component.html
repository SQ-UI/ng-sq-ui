<div class="input-field textarea" [class.disabled]="disabled()">
  @if (controlLabel() !== '') {
    <div class="label"
         [attr.id]="controlId() + '-label'"
         (click)="focusOnArea()">
      {{controlLabel()}}
    </div>
  }

  <div #textarea
       [attr.id]="controlId()"
       [attr.contenteditable]="disabled() ? 'false' : 'true'"
       [attr.tabindex]="disabled() ? -1 : 0"
       (click)="focusOnArea()"
       (input)="onInput($event)"
       (blur)="touch.emit()"
       [style.min-height.px]="minHeight()"
       [attr.data-placeholder]="controlPlaceholder()"
       [class.hide-placeholder]="!isPlaceholderVisible()"
       role="textbox"
       aria-multiline="true"
       [attr.aria-labelledby]="controlLabel() ? controlId() + '-label' : null"
       [attr.aria-placeholder]="controlPlaceholder() || null"
       [attr.aria-required]="required()"
       [attr.aria-disabled]="disabled()">
  </div>

</div>
