<div class="input-field textarea" [class.disabled]="disabled()">
  @if (controlLabel() !== '') {
  <div class="label" (click)="focusOnArea()">
    {{ controlLabel() }}
  </div>
  }

  <div
    contenteditable="true"
    #textarea
    tabindex="0"
    (click)="focusOnArea()"
    (input)="inputChange($event)"
    (blur)="emitTouch()"
    [style.min-height.px]="minHeight()"
    [attr.data-placeholder]="controlPlaceholder()"
    [class.hide-placeholder]="!isPlaceholderVisible()"
    role="textarea"
  ></div>
</div>
