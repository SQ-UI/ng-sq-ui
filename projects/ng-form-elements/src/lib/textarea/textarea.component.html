<div class="sq-form-field">
  @if (controlLabel() !== '') {
    <div class="label sq-field-label"
         [attr.id]="controlId() + '-label'"
         (click)="focusOnArea()">
      {{controlLabel()}}
    </div>
  }

  <div class="input-field textarea" [class.disabled]="disabled()">
    <div #textarea
         [attr.id]="controlId()"
         [attr.contenteditable]="disabled() ? 'false' : 'true'"
         [attr.tabindex]="disabled() ? -1 : 0"
         (click)="focusOnArea()"
         (input)="onInput($event)"
         (blur)="touch.emit()"
         [style.min-height.px]="minHeight()"
         [attr.data-placeholder]="controlPlaceholder()"
         [class.hide-placeholder]="!isPlaceholderVisible()"
         role="textbox"
         aria-multiline="true"
         [attr.aria-labelledby]="controlLabel() ? controlId() + '-label' : null"
         [attr.aria-placeholder]="controlPlaceholder() || null"
         [attr.aria-required]="required()"
         [attr.aria-disabled]="disabled()"
         [attr.aria-invalid]="errorText() ? 'true' : null"
         [attr.aria-describedby]="(errorText() || helpText()) ? controlId() + '-message' : null">
    </div>
  </div>
  @if (errorText() || helpText()) {
    <div class="sq-field-message" [class.sq-field-error]="!!errorText()"
         [id]="controlId() + '-message'" [attr.role]="errorText() ? 'alert' : null">{{errorText() || helpText()}}</div>
  }
</div>
