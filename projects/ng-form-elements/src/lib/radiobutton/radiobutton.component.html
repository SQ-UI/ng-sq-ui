<div class="checkable"
     [class.checked]="isSelected()"
     [class.disabled]="disabled()">
  <!-- The native input covers the whole control (see radiobutton.component.scss), so it is the only
       interaction path; the browser also handles arrow-key navigation inside the group. -->
  <input type="radio"
         [name]="name()"
         [id]="controlId()"
         [disabled]="disabled()"
         [checked]="isSelected()"
         (change)="selectRadio()"
         (blur)="touch.emit()">

  <ng-template #defaultRadioButtonTemplate>
    <div class="radio">
      <div class="inner"></div>
    </div>
    <div class="label">{{controlLabel() ? controlLabel() : radioValue()}}</div>
  </ng-template>

  @if (labelTemplate(); as tmpl) {
    <ng-template [ngTemplateOutlet]="tmpl.template"
                 [ngTemplateOutletContext]="{ value: radioValue(), isSelected: isSelected() }">
    </ng-template>
  } @else {
    <ng-template [ngTemplateOutlet]="defaultRadioButtonTemplate"
                 [ngTemplateOutletContext]="{ value: radioValue(), isSelected: isSelected() }">
    </ng-template>
  }
</div>
