<div
  class="input-field dropdown"
  [class.disabled]="disabled()"
  sqOutsideClickListener
  [listenForOutsideClick]="listenForOutsideClick()"
  (clickOutside)="onClickOutsideComponent()"
  (click)="toggleOptionsDropdown()"
>
  <div class="label">{{ controlLabel() }}</div>

  <ng-template #defaultSelectedItemTemplate>
    @if (value(); as selected) {
    <div class="chosen-item">{{ selected.label }}</div>
    }
  </ng-template>
  @if (value(); as selected) {
  <ng-template
    [ngTemplateOutlet]="selectedItemTemplate() || defaultSelectedItemTemplate"
    [ngTemplateOutletContext]="{ value: selected }"
  >
  </ng-template>
  } @if (!value()) {
  <div class="input-placeholder">{{ controlPlaceholder() }}</div>
  }

  <ng-template #defaultChevronTemplate>
    <i class="fas fa-chevron-down dropdown-icon" aria-hidden="true"> </i>
  </ng-template>

  <ng-template
    [ngTemplateOutlet]="chevronTemplate() || defaultChevronTemplate"
    [ngTemplateOutletContext]="{ isDropdownOpen: isOpen() }"
  >
  </ng-template>

  @if (isOpen()) {
  <div class="options">
    @for (option of options(); track option) {
    <div (click)="selectOption(option)">
      <ng-template #defaultOptionTemplate>
        <div class="option">
          {{ option.label }}
        </div>
      </ng-template>
      <ng-template
        [ngTemplateOutlet]="optionTemplate() || defaultOptionTemplate"
        [ngTemplateOutletContext]="{ option: option }"
      >
      </ng-template>
    </div>
    }
  </div>
  }
</div>
