<div class="checkable"
     [class.checked]="isSelected()"
     [class.disabled]="disabled()">
  <!-- The native input is stretched over the whole control (see checkbox.component.scss), so it is
       the single interaction path: no wrapper click handler means no double toggle. -->
  <input type="checkbox"
         [name]="name()"
         [id]="controlId()"
         [disabled]="disabled()"
         [checked]="isSelected()"
         (change)="toggleCheckboxSelection()"
         (blur)="touch.emit()">

  <ng-template #defaultCheckboxTemplate>
    <div class="checkbox">
      <div class="inner"></div>
    </div>
    <div class="label">{{controlLabel()}}</div>
  </ng-template>

  @if (labelTemplate(); as tmpl) {
    <ng-template [ngTemplateOutlet]="tmpl.template"
                 [ngTemplateOutletContext]="{ isSelected: isSelected() }">
    </ng-template>
  } @else {
    <ng-template [ngTemplateOutlet]="defaultCheckboxTemplate"
                 [ngTemplateOutletContext]="{ isSelected: isSelected() }">
    </ng-template>
  }
</div>
