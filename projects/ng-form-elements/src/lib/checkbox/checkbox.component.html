<div class="checkable"
     [class.checked]="isSelected()"
     [class.disabled]="disabled()">
  <!-- The native input is stretched over the whole control and layered above the square (see
       checkbox.component.scss), so it is the single interaction path: no wrapper click handler means
       no double toggle. -->
  <input type="checkbox"
         [name]="name()"
         [id]="controlId()"
         [disabled]="disabled()"
         [checked]="isSelected()"
         (change)="toggleCheckboxSelection()"
         (blur)="touch.emit()">

  <ng-template #defaultCheckboxTemplate>
    <div class="checkbox">
      <svg class="inner" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="m3 8 3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <label class="label" [for]="controlId()">{{controlLabel()}}</label>
  </ng-template>

  @if (labelTemplate(); as tmpl) {
    <ng-template [ngTemplateOutlet]="tmpl.template"
                 [ngTemplateOutletContext]="{ isSelected: isSelected() }">
    </ng-template>
  } @else {
    <ng-template [ngTemplateOutlet]="defaultCheckboxTemplate"
                 [ngTemplateOutletContext]="{ isSelected: isSelected() }">
    </ng-template>
  }
</div>
