@if (pages().length > 0) {
  <ol class="paginator display-flex wrap" [attr.data-size]="size()" [attr.aria-label]="label()">
    <li>
      <button type="button"
              [disabled]="disablePrevBtns()"
              data-btn-type="first"
              aria-label="First page"
              (click)="onPageClick(pages()[0])">
        <i class="fas fa-angle-double-left" aria-hidden="true"></i>
      </button>
    </li>
    <li>
      <button type="button"
              [disabled]="disablePrevBtns()"
              data-btn-type="prev"
              aria-label="Previous page"
              (click)="navigateToPage(-1)">
        <i class="fas fa-angle-left" aria-hidden="true"></i>
      </button>
    </li>
    @for (page of pages(); track page.number) {
      <li [hidden]="page.isHidden && !!pages()[$index - 1]?.isHidden"
          [class.gap]="page.isHidden && !pages()[$index - 1]?.isHidden"
          [attr.aria-hidden]="page.isHidden ? 'true' : null"
          data-btn-type="page-num"
          [ngClass]="{
            'current': page.isSelected,
            'truncated': page.isHidden
          }">
        @if (!page.isHidden) {
        <button type="button"
                [attr.aria-label]="'Page ' + page.number"
                [attr.aria-current]="page.isSelected ? 'page' : null"
                (click)="onPageClick(page)">
          {{page.number}}
        </button>
        } @else {
          <span class="paginator-ellipsis">…</span>
        }
      </li>
    }
    <li>
      <button type="button"
              [disabled]="disableNextBtns()"
              data-btn-type="next"
              aria-label="Next page"
              (click)="navigateToPage(1)">
        <i class="fas fa-angle-right" aria-hidden="true"></i>
      </button>
    </li>
    <li>
      <button type="button"
              [disabled]="disableNextBtns()"
              data-btn-type="last"
              aria-label="Last page"
              (click)="onPageClick(pages()[pages().length - 1])">
        <i class="fas fa-angle-double-right" aria-hidden="true"></i>
      </button>
    </li>
  </ol>
}
