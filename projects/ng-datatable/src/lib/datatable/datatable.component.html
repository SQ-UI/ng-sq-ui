<div class="datatable-wrapper" [attr.data-size]="size()">
  <table class="datatable">
    <thead>
      <tr>
        @for (column of columnNames(); track column.name) {
          <th sq-datatable-column
              [name]="column.name"
              [isSortable]="column.canBeSortedAgainst"
              [activeSortColumn]="activeSortColumn()"
              (onSortClicked)="sortByField($event)">
          </th>
        }
      </tr>
      @if (datatableHeaderTemplate()) {
        <ng-template [ngTemplateOutlet]="datatableHeaderTemplate()"></ng-template>
      }
    </thead>
    <tbody>
      @for (rowItem of paginatedCollection(); track $index) {
        <tr sq-datatable-row
            [rowItem]="rowItem"
            [columns]="columnKeys()"
            class="row">
        </tr>
      }
      @if (datatableBodyTemplate()) {
        <ng-template [ngTemplateOutlet]="datatableBodyTemplate()"></ng-template>
      }
    </tbody>
  </table>

  @if (emptyText() && items().length === 0 && !datatableBodyTemplate()) {
    <div class="datatable-empty" role="status">{{emptyText()}}</div>
  }

  <sq-paginator #paginator
                [items]="sortedItems()"
                [itemsPerPage]="paginatorConfig().itemsPerPage"
                [lastPage]="paginatorConfig().lastPage"
                [currentPage]="paginatorConfig().currentPage"
                [maxDisplayedPages]="paginatorConfig().maxDisplayedPages"
                (pageChange)="onPageChange($event)"
                (paginatedCollectionChange)="onPaginatedCollectionChange($event)">
  </sq-paginator>
</div>
