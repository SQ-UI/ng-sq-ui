<div role="columnheader" class="column">
  {{ name() }}

  @if (isSortable()) {
  <button type="button" (click)="sort()">
    <i
      class="fas"
      aria-hidden="true"
      [class.fa-sort]="isSortedByAscending === undefined"
      [class.fa-sort-up]="isSortedByAscending === true"
      [class.fa-sort-down]="isSortedByAscending === false"
    >
    </i>
  </button>
  }
</div>
