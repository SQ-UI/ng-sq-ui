<div role="columnheader"
     class="column">
  {{name()}}

  @if (isSortable()) {
    <button type="button" (click)="sort()">
      <i class="fas"
         aria-hidden="true"
         [class.fa-sort]="sortState() === undefined"
         [class.fa-sort-up]="sortState() === true"
         [class.fa-sort-down]="sortState() === false">
      </i>
    </button>
  }
</div>
