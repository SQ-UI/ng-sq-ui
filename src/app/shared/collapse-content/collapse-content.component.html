<section class="content-wrapper">
  <header class="display-flex">
    @if (!isSecondary()) {
      <h3 (click)="toggleCollapse()" class="header-btn">
        {{title()}}
      </h3>
    } @else {
      <h4 (click)="toggleCollapse()" class="header-btn">
        {{title()}}
      </h4>
    }

    <button type="button"
            class="btn-collapse"
            [attr.aria-expanded]="!isCollapsed()"
            [attr.aria-label]="isCollapsed() ? 'Expand section' : 'Collapse section'"
            (click)="toggleCollapse()">
      <i class="fas"
         [ngClass]="{'fa-chevron-up': !isCollapsed(), 'fa-chevron-down': isCollapsed()}"
         aria-hidden="true"></i>
    </button>
  </header>

  <!-- `hidden` instead of `@if` keeps the projected content alive, so form state survives toggling. -->
  <div class="collapsed-content" [hidden]="isCollapsed()">
    <ng-content select="[sq-collapse-body]"></ng-content>
  </div>
</section>
