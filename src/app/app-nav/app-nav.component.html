<button class="demo-skip" type="button" (click)="focusMain()">Skip to content</button>
<header class="demo-topbar">
  <button #menuButton type="button" class="demo-menu-button" [attr.aria-label]="isNavOpen() ? 'Close navigation' : 'Open navigation'" aria-controls="demo-sidebar"
          [attr.aria-expanded]="isNavOpen()" (click)="isNavOpen() ? closeFromKeyboard() : showNav($event)">
    <i class="fas fa-bars" aria-hidden="true"></i>
  </button>
  <a routerLink="/about" class="demo-brand" aria-label="SQ UI home" (click)="onClickOutsideComponent()">
    <img src="assets/logo.svg" alt="" class="demo-logo" width="56" height="36">
    <span class="demo-brand-copy"><strong>SQ UI</strong><span>Simple Quality UI</span></span>
  </a>
  <span class="demo-topbar-caption">Component library <span> / </span> Angular</span>
  <div class="demo-topbar-actions">
    <a class="demo-design-link" href="https://www.figma.com/design/jeP0qbpUUGZbbxaWnvFr6i/SQUI-Design-System?node-id=28-10" target="_blank" rel="noreferrer">Design system <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
    <a class="demo-github-link" href="https://github.com/sq-ui/ng-sq-ui" target="_blank" rel="noreferrer"><i class="fas fa-code" aria-hidden="true"></i><span>GitHub</span></a>
  </div>
</header>

@if (isNavOpen()) { <button type="button" class="tint" aria-label="Close navigation" (click)="onClickOutsideComponent()"></button> }
<aside class="app-nav" id="demo-sidebar" [class.show]="isNavOpen()" aria-label="Showcase navigation"
       sqOutsideClickListener [listenForOutsideClick]="listenForOutsideClick()" (clickOutside)="onClickOutsideComponent()">
  <div class="demo-sidebar-heading"><span>WORKSPACE</span><button type="button" class="close-btn" aria-label="Close navigation" (click)="closeFromKeyboard()"><i class="fas fa-xmark" aria-hidden="true"></i></button></div>
  <nav aria-label="Components">
    @for (navItem of navItems(); track navItem.routeLink) {
      <a class="nav-item" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLink]="'/' + navItem.routeLink" (click)="onClickOutsideComponent()">
        <i class="fas {{navItem.icon}}" aria-hidden="true"></i><span>{{navItem.name}}</span>
        @if (navItem.routeLink === 'preview') { <span class="demo-nav-count">17</span> }
      </a>
    }
  </nav>
  <div class="demo-sidebar-footer">
    <span class="demo-version"><span aria-hidden="true"></span>Version 3.0</span>
    <p>Made for the way<br>you build.</p>
    <a href="https://github.com/SQ-UI/ng-sq-ui/blob/master/CONTRIBUTING.md" target="_blank" rel="noreferrer">Contribute to SQ UI <span aria-hidden="true">↗</span></a>
  </div>
</aside>
